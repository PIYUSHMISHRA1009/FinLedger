[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finledger"
version = "1.0.0"
description = "Production-grade digital wallet and transaction platform"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Principal Software Engineer", email = "engineer@finledger.io"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "faker>=25.3.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "bandit>=1.7.5",
    "pre-commit>=3.7.0",
    "testcontainers>=4.7.0",
]

[project.urls]
Homepage = "https://github.com/finledger/finledger"
Repository = "https://github.com/finledger/finledger"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finledger*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20", "PTH"]
ignore = ["E501", "B008", "C901"]
per-file-ignores = { "tests/*" = ["S101", "S106"] }
format.quote-style = "double"
format.indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["finledger"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "redis", "celery"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --cov=finledger --cov-fail-under=80"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]