global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'finledger-dev'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'finledger-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    # Would need postgres_exporter

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    # Would need redis_exporter

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    # Would need node_exporter

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    # Would need cadvisor